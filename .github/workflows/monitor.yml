name: SEU_Monitor
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scheduled-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o monitor ./cmd/monitor
      - name: Scan and preserve processed IDs
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          mkdir -p "$RUNNER_TEMP/seu-monitor/state"
          if [ -d store ]; then cp -R store/. "$RUNNER_TEMP/seu-monitor/state/"; fi
          ./monitor --data-dir "$RUNNER_TEMP/seu-monitor" --once
          mkdir -p store
          cp -R "$RUNNER_TEMP/seu-monitor/state/." store/
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add store/
          if ! git diff --cached --quiet; then
            git commit -m '自动更新推送记录 [skip ci]'
            git push
          fi
